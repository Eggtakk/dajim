<meta charset="utf-8">
<title>다짐 — UI 프로토타입</title>
<style>
  :root{
    --paper:#FFFFFF; --paper-raised: color-mix(in srgb, var(--brand) 3%, white); --ink:#000000; --ink-soft:rgba(0,0,0,0.58);
    --brand:#4158FB; --brand-soft:rgba(65,88,251,0.10); --brand-deep:#0523F8;
    --accent-pink:#FB41B5; --accent-pink-soft:rgba(251,65,181,0.14);
    --accent-yellow:#FBE441;
    --accent-green:#41FB87; --accent-green-soft:rgba(65,251,135,0.16);
    --line: rgba(0,0,0,0.14); --line-strong: rgba(0,0,0,0.28);
    --shadow: rgba(0,0,0,0.12);
    --chrome-bg: #000000;
    --font-kr: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#000000; --paper-raised: color-mix(in srgb, var(--brand) 6%, black); --ink:#FFFFFF; --ink-soft:rgba(255,255,255,0.62);
      --brand:#7F8EFC; --brand-soft:rgba(127,142,252,0.16); --brand-deep:#4158FB;
      --line: rgba(255,255,255,0.16); --line-strong: rgba(255,255,255,0.30);
      --shadow: rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#000000; --paper-raised: color-mix(in srgb, var(--brand) 6%, black); --ink:#FFFFFF; --ink-soft:rgba(255,255,255,0.62);
    --brand:#7F8EFC; --brand-soft:rgba(127,142,252,0.16); --brand-deep:#4158FB;
    --line: rgba(255,255,255,0.16); --line-strong: rgba(255,255,255,0.30);
    --shadow: rgba(0,0,0,0.6);
  }
  :root[data-theme="light"]{
    --paper:#FFFFFF; --paper-raised: color-mix(in srgb, var(--brand) 3%, white); --ink:#000000; --ink-soft:rgba(0,0,0,0.58);
    --brand:#4158FB; --brand-soft:rgba(65,88,251,0.10); --brand-deep:#0523F8;
    --line: rgba(0,0,0,0.14); --line-strong: rgba(0,0,0,0.28);
    --shadow: rgba(0,0,0,0.12);
  }

  *{ box-sizing:border-box; }
  body{ margin:0; }
  .page{
    font-family: var(--font-kr);
    color: var(--ink);
    background: var(--paper);
    min-height:100vh;
    padding: 28px 20px 80px;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

  /* ---------- meta toolbar ---------- */
  .meta{
    max-width: 1180px; margin: 0 auto 22px; padding: 16px 20px;
    background: var(--paper-raised); border:1px solid var(--line); border-radius: 14px;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px 22px;
    box-shadow: 0 1px 0 var(--line);
  }
  .meta-brand{ display:flex; align-items:baseline; gap:8px; margin-right:auto; }
  .meta-brand .mark{ font-family: var(--font-kr); font-size:20px; font-weight:800; letter-spacing:0.01em; }
  .meta-brand .sub{ font-size:12px; color:var(--ink-soft); }
  .seg{ display:inline-flex; background:var(--brand-soft); border-radius:999px; padding:3px; gap:2px; }
  .seg button{
    border:none; background:transparent; padding:7px 14px; border-radius:999px; font-size:13px;
    font-family:inherit; color:var(--ink-soft); cursor:pointer; font-weight:600; transition: background .18s, color .18s;
  }
  .seg button.active{ background:var(--brand); color:var(--paper-raised); }
  .seg button:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .jump{ display:flex; flex-wrap:wrap; gap:6px; }
  .jump button{
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    padding:6px 12px; border-radius:999px; font-size:12.5px; font-family:inherit; cursor:pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .jump button.active{ border-color:var(--brand); color:var(--brand); background:var(--brand-soft); font-weight:700; }
  .jump button:hover{ border-color:var(--line-strong); }
  .jump button:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

  .stage-wrap{ max-width:1180px; margin:0 auto; display:flex; justify-content:center; }

  /* ================= shared UI atoms ================= */
  .icon{ width:1em; height:1em; display:inline-block; vertical-align:-0.15em; }
  .num{ font-variant-numeric: tabular-nums; }
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .pill.warn{ background: color-mix(in srgb, var(--ink) 7%, transparent); color:var(--ink); }
  .pill.good{ background:var(--accent-green-soft); color:var(--accent-green); }
  .pill.neutral{ background:var(--brand-soft); color:var(--brand); }
  .pill.streak{ background:var(--accent-yellow); color:#000; }
  .btn{
    font-family:inherit; border:none; border-radius:12px; padding:13px 20px; font-size:14.5px; font-weight:700;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition: transform .12s, opacity .12s;
  }
  .btn:active{ transform: scale(0.98); }
  .btn:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .btn.primary{ background:var(--brand); color:#fff; }
  .btn.primary:hover{ opacity:0.92; }
  .btn.ghost{ background:transparent; color:var(--brand); border:1px solid var(--line-strong); }
  .btn.accent{ background:var(--accent-pink); color:#fff; }
  .btn.accent:hover{ opacity:0.92; }
  .card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:16px; }
  .chip{
    border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink);
    padding:8px 14px; border-radius:999px; font-size:13px; font-family:inherit; cursor:pointer; font-weight:600;
  }
  .chip.selected{ background:var(--brand); border-color:var(--brand); color:var(--paper-raised); }
  .chip:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .eyebrow{ font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--brand); font-weight:700; }
  .hr{ height:1px; background:var(--line); border:none; margin:0; }

  /* screens visibility */
  .screen{ display:none; }
  .screen.active{ display:block; animation: fadein .25s ease; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }

  /* ================= DESKTOP STAGE ================= */
  .stage{ display:none; width:100%; }
  .stage.active{ display:block; }

  .browser{
    background: var(--paper-raised);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    box-shadow: 0 20px 60px -20px var(--shadow);
  }
  .chrome{
    display:flex; align-items:center; gap:14px; padding:12px 16px;
    background: color-mix(in srgb, var(--paper) 60%, var(--paper-raised));
    border-bottom:1px solid var(--line);
  }
  .traffic{ display:flex; gap:7px; }
  .traffic span{ width:11px; height:11px; border-radius:50%; background:var(--line-strong); }
  .urlbar{
    flex:1; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:6px 14px;
    font-size:12.5px; color:var(--ink-soft); text-align:center;
  }
  .app{ display:flex; height:720px; }
  .rail{
    width:236px; flex-shrink:0; background:var(--chrome-bg); color:#EFEBDD; padding:24px 18px;
    display:flex; flex-direction:column; gap:26px;
  }
  .rail-brand{ font-family:var(--font-kr); font-size:22px; font-weight:800; letter-spacing:0.01em; color:#fff; }
  .rail-brand small{ display:block; font-family:var(--font-kr); font-size:11px; font-weight:500; opacity:0.6; letter-spacing:0.02em; margin-top:2px; }
  .rail-user{ display:flex; align-items:center; gap:10px; padding:12px; background:rgba(255,255,255,0.06); border-radius:12px; }
  .avatar{ width:36px; height:36px; border-radius:50%; background:var(--accent-pink); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:14px; }
  .rail-user .name{ font-size:13.5px; font-weight:700; }
  .rail-user .desc{ font-size:11.5px; opacity:0.65; }
  .rail-nav{ display:flex; flex-direction:column; gap:3px; }
  .rail-nav button{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; border:none;
    background:transparent; color:rgba(239,235,221,0.75); font-family:inherit; font-size:13.5px; font-weight:600;
    cursor:pointer; text-align:left;
  }
  .rail-nav button svg{ width:17px; height:17px; opacity:0.9; }
  .rail-nav button.active{ background:rgba(255,255,255,0.12); color:#fff; }
  .rail-nav button:hover{ color:#fff; }
  .rail-nav button:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .rail-foot{ margin-top:auto; font-size:11px; opacity:0.5; line-height:1.6; }

  .canvas{ flex:1; overflow-y:auto; padding:34px 40px; background:var(--paper); }
  .canvas-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:26px; }
  .canvas-head h1{ font-family:var(--font-kr); font-size:26px; margin:0 0 6px; font-weight:800; letter-spacing:0.01em; }
  .canvas-head .date{ font-size:13px; color:var(--ink-soft); }

  .bento{ display:grid; grid-template-columns: 1.5fr 1fr; gap:18px; }
  .bento-full{ grid-column: 1 / -1; }

  /* ================= MOBILE STAGE ================= */
  .phone{
    width:375px; height:812px; background:var(--chrome-bg); border-radius:52px; padding:14px;
    box-shadow: 0 30px 70px -20px var(--shadow); position:relative;
  }
  .phone-screen{ width:100%; height:100%; background:var(--paper); border-radius:38px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:28px; background:var(--chrome-bg); border-radius:0 0 18px 18px; z-index:5; }
  .statusbar{ display:flex; justify-content:space-between; padding:16px 26px 4px; font-size:13px; font-weight:700; color:var(--ink); flex-shrink:0; }
  .m-scroll{ flex:1; overflow-y:auto; padding:6px 20px 18px; }
  .m-scroll::-webkit-scrollbar{ display:none; }
  .tabbar{
    flex-shrink:0; display:flex; justify-content:space-around; align-items:center; padding:10px 8px 26px;
    border-top:1px solid var(--line); background:var(--paper-raised);
  }
  .tabbar button{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--ink-soft); font-family:inherit; font-size:10.5px; font-weight:600; cursor:pointer; padding:4px 6px;
  }
  .tabbar button svg{ width:21px; height:21px; }
  .tabbar button.active{ color:var(--brand); }
  .tabbar button:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:8px; }

  .m-head{ padding:14px 2px 18px; }
  .m-head h1{ font-family:var(--font-kr); font-size:21px; margin:0 0 4px; font-weight:800; }
  .m-head .date{ font-size:12.5px; color:var(--ink-soft); }

  /* content components reused in both */
  .predict-card{
    padding:24px; border-radius:18px; position:relative; overflow:hidden;
  }
  .predict-card.neg{ background: var(--paper-raised); border:1.5px solid var(--ink); }
  .predict-card.pos{ background: var(--paper-raised); border:1.5px solid var(--brand); }
  .predict-card .icon-badge{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .predict-card.neg .icon-badge{ background:var(--ink); color:var(--paper); }
  .predict-card.pos .icon-badge{ background:var(--brand); color:#fff; }
  .predict-card p.lead{ font-size:16.5px; line-height:1.55; margin:0 0 14px; font-weight:600; }
  .predict-card .metric{ font-size:15px; font-weight:800; }
  .predict-card.neg .metric{ color:var(--ink); }
  .predict-card.pos .metric{ color:var(--brand); }
  .predict-note{ font-size:12px; color:var(--ink-soft); margin-top:12px; }

  .stat-card{ padding:18px 20px; }
  .stat-card .label{ font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; font-weight:600; }
  .stat-card .value{ font-size:23px; font-weight:800; }
  .stat-card .change{ font-size:12.5px; margin-top:6px; font-weight:700; }
  .stat-card .change.up{ color:var(--ink); }
  .stat-card .change.down{ color:var(--brand); }

  .row-link{
    display:flex; align-items:center; gap:14px; padding:15px 4px; border:none; background:none; width:100%;
    text-align:left; font-family:inherit; cursor:pointer; border-bottom:1px solid var(--line); color:var(--ink);
  }
  .row-link:last-child{ border-bottom:none; }
  .row-link .ic{ width:36px; height:36px; border-radius:10px; background:var(--brand-soft); color:var(--brand); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .row-link .ic svg{ width:18px; height:18px; }
  .row-link .txt{ flex:1; }
  .row-link .txt .t{ font-size:14px; font-weight:700; }
  .row-link .txt .d{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .row-link .chev{ width:16px; height:16px; color:var(--ink-soft); flex-shrink:0; }
  .row-link:hover{ background:var(--brand-soft); border-radius:10px; }
  .row-link:focus-visible{ outline:2px solid var(--brand); outline-offset:-2px; border-radius:10px; }

  .tx-day{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:20px 0 8px; text-transform:uppercase; letter-spacing:0.03em; }
  .tx-day:first-child{ margin-top:0; }
  .tx-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .tx-row:last-child{ border-bottom:none; }
  .tx-ic{ width:38px; height:38px; border-radius:10px; background:var(--brand-soft); color:var(--brand); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .tx-ic svg{ width:18px; height:18px; }
  .tx-mid{ flex:1; min-width:0; }
  .tx-mid .t{ font-size:13.5px; font-weight:700; }
  .tx-mid .d{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .tx-amt{ font-size:14.5px; font-weight:800; flex-shrink:0; }

  .segctrl{ display:flex; background:var(--brand-soft); border-radius:12px; padding:4px; gap:2px; }
  .segctrl button{ flex:1; border:none; background:transparent; padding:11px; border-radius:9px; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .segctrl button.active{ background:var(--paper-raised); color:var(--brand); box-shadow:0 1px 4px var(--shadow); }
  .segctrl button:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

  .field-label{ font-size:13px; font-weight:700; color:var(--ink); margin:22px 0 10px; display:flex; justify-content:space-between; align-items:center; }
  .field-label:first-child{ margin-top:0; }
  .chiprow{ display:flex; flex-wrap:wrap; gap:8px; }
  .slider-wrap{ padding:6px 2px; }
  input[type="range"]{ width:100%; accent-color:var(--brand); height:4px; cursor:pointer; }
  .slider-nums{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-top:4px; }
  .preview-box{ background:var(--brand-soft); border-radius:14px; padding:18px 20px; margin-top:22px; }
  .preview-box .t1{ font-size:14.5px; font-weight:700; color:var(--brand-deep); line-height:1.5; }
  .preview-box .t2{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }

  .chart-wrap{ background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .chart-legend{ display:flex; gap:16px; font-size:11.5px; color:var(--ink-soft); margin-top:10px; }
  .chart-legend .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }

  .track-progress{ display:flex; gap:5px; margin:16px 0 4px; }
  .track-progress .seg{ flex:1; height:6px; border-radius:99px; background:var(--line-strong); }
  .track-progress .seg.done{ background:var(--accent-green); }
  .track-progress .seg.now{ background:var(--accent-yellow); }

  .cat-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .cat-row:last-child{ border-bottom:none; }
  .cat-row .name{ font-weight:600; display:flex; align-items:center; gap:9px; }
  .cat-row .name .sw{ width:8px; height:8px; border-radius:50%; }

  .onboard-illo{ height:200px; border-radius:18px; background: linear-gradient(135deg, var(--brand-soft), var(--accent-pink-soft)); display:flex; align-items:center; justify-content:center; margin-bottom:26px; position:relative; overflow:hidden; }
  .onboard-illo svg{ width:88px; height:88px; color:var(--brand); }
  .dots{ display:flex; gap:6px; justify-content:center; margin-top:22px; }
  .dots span{ width:6px; height:6px; border-radius:50%; background:var(--line-strong); }
  .dots span.active{ background:var(--brand); width:18px; border-radius:99px; }

  .reset-card{ border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-top:12px; cursor:pointer; transition:border-color .15s, background .15s; background:var(--paper-raised); }
  .reset-card:hover{ border-color:var(--brand); background:var(--brand-soft); }
  .reset-card.chosen{ border-color:var(--brand); background:var(--brand-soft); }
  .reset-card .t{ font-size:13.5px; font-weight:700; margin-bottom:4px; }
  .reset-card .d{ font-size:12px; color:var(--ink-soft); line-height:1.5; }

  .result-hero{ text-align:center; padding:30px 20px; }
  .result-hero .ic{ width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .result-hero.win .ic{ background:var(--accent-green-soft); color:var(--accent-green); }
  .result-hero.lose .ic{ background: color-mix(in srgb, var(--ink) 8%, transparent); color:var(--ink); }
  .result-hero .ic svg{ width:28px; height:28px; }
  .result-hero h2{ font-family:var(--font-kr); font-size:21px; margin:0 0 8px; font-weight:800; }
  .result-hero p{ font-size:13.5px; color:var(--ink-soft); margin:0; line-height:1.6; }
  .result-compare{ display:flex; gap:12px; margin-top:20px; }
  .result-compare .box{ flex:1; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center; }
  .result-compare .box .l{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .result-compare .box .v{ font-size:19px; font-weight:800; margin-top:4px; }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>

/* ---------- top meta controls ---------- */
function buildMeta(){

}

/* ---------- desktop rail / mobile tabbar (only 5 real tabs) ---------- */
function buildNavs(){
  const rail = document.getElementById('railNav');
  rail.innerHTML = TABS.map(id=>{
    const s = SCREENS.find(x=>x.id===id);
    return `<button data-nav="${id}" onclick="goto('${id}')"><svg class="icon"><use href="#${s.icon}"/></svg>${s.label}</button>`;
  }).join('');
  const tabbar = document.getElementById('tabbarNav');
  tabbar.innerHTML = TABS.map(id=>{

    return `<button data-nav="${id}" onclick="goto('${id}')"><svg class="icon"><use href="#${s.icon}"/></svg>${s.label}</button>`;
  }).join('');
}

function setDevice(d){
  state.device = d;
  document.getElementById('devDesktop').classList.toggle('active', d==='desktop');
  document.getElementById('devMobile').classList.toggle('active', d==='mobile');
  document.getElementById('stageDesktop').classList.toggle('active', d==='desktop');
  document.getElementById('stageMobile').classList.toggle('active', d==='mobile');
}

function goto(id){
  state.screen = id;
  document.querySelectorAll('#jumpRow button').forEach(b=>b.classList.toggle('active', b.dataset.jump===id));

function sparkline(values, color){
  const w=520,h=90,max=Math.max(...values),min=Math.min(...values);
  const pts = values.map((v,i)=>{
    const x = (i/(values.length-1))*w;
    const y = h - ((v-min)/(max-min||1))*(h-14) - 7;
    return `${x},${y}`;
  }).join(' ');
  const last = pts.split(' ').pop().split(',');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:90px; overflow:visible;">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${color}"/>
  </svg>`;
}

      <div class="cat-row"><span class="name"><span class="sw" style="background:var(--brand)"></span>배달음식</span><span class="num" style="color:var(--brand); font-weight:700;">-22%</span></div>

      <div class="cat-row"><span class="name"><span class="sw" style="background:var(--brand)"></span>쇼핑</span><span class="num" style="color:var(--brand); font-weight:700;">-3%</span></div>
      <div class="cat-row"><span class="name"><span class="sw" style="background:var(--ink-soft)"></span>구독서비스</span><span class="num">0%</span></div>
    </div>`;
  if(desktop) return `<div class="canvas-head"><div><h1>소비 트래킹</h1><div class="date">설정한 주기마다 자동으로 분석해드려요</div></div></div><div style="max-width:600px;">${body}</div>`;
  return `<div class="m-head"><h1>소비 트래킹</h1><div class="date">주기별 분석 리포트</div></div>${body}`;
}
function sparklineDual(){
  const goalLine=[100,96,92,88,84,80,76,72], actual=[100,94,89,80,74,66,58,52];
  const w=520,h=100,max=100,min=45;
  const toPts=(arr)=>arr.map((v,i)=>{ const x=(i/(arr.length-1))*w; const y=h-((v-min)/(max-min))*(h-14)-7; return `${x},${y}`; }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:100px; overflow:visible;">
    <polyline points="${toPts(goalLine)}" fill="none" stroke="var(--line-strong)" stroke-width="2" stroke-dasharray="5 5"/>
    <polyline points="${toPts(actual)}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function resultContent(desktop){

    </div>
    <div class="card" style="padding:18px 20px; margin-top:14px;">

      <div class="reset-card chosen"><div class="t">카페 소비 15% 줄이기 · 2개월</div><div class="d">최근 두 달간 카페 지출이 꾸준히 늘고 있어요. 이번엔 카페로 다짐해볼까요?</div></div>

      <h2>목표에는 못 미쳤지만,<br>시작한 것만으로 의미 있어요</h2><p>배달음식 소비가 예상보다 줄지 않았어요. 방법을 조금 바꿔서 다시 다짐해볼까요?</p>
      <div class="result-compare"><div class="box"><div class="l">목표</div><div class="v num">-20%</div></div><div class="box"><div class="l">실제</div><div class="v num" style="color:var(--ink);">-6%</div></div><div class="box"><div class="l">절감액</div><div class="v num">11,200원</div></div></div>
    </div>
    <div style="margin-top:16px;">
      <div style="font-size:13.5px; font-weight:700; margin-bottom:4px;">목표 재설정을 추천해요</div>
      <div class="reset-card"><div class="t">기간을 2개월 더 연장하기</div><div class="d">급하게 줄이기보다, 천천히 습관을 만들어가는 방법이에요.</div></div>
      <div class="reset-card chosen"><div class="t">목표를 20% → 12%로 완화하기</div><div class="d">달성 가능한 수준부터 시작하면 다음 다짐이 더 쉬워져요.</div></div>
      <div class="reset-card"><div class="t">배달음식 대신 구독서비스 줄이기</div><div class="d">최근 구독서비스 지출이 늘었어요. 카테고리를 바꿔볼 수 있어요.</div></div>
    </div>

}
function setResult(m){ state.result=m; render(); }

const CONTENT = {
  onboard: (d)=>onboardContent(),
  home: homeContent,
  spending: spendingContent,
  goal: goalContent,
  scenario: scenarioContent,
  tracking: trackingContent,
  result: resultContent,
};

function render(){
  document.getElementById('dCanvas').innerHTML = CONTENT[state.screen](true);
  document.getElementById('mCanvas').innerHTML = CONTENT[state.screen](false);
}

buildMeta();
buildNavs();
